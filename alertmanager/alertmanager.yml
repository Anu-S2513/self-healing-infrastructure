global:
  resolve_timeout: 30s

route:
  group_by: ['alertname', 'service']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 5m
  receiver: 'fastapi-webhook'

receivers:
  - name: 'fastapi-webhook'
    webhook_configs:
      - url: 'http://auto-healer:8000/webhook'
        send_resolved: true
